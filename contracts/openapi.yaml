openapi: 3.1.0
info:
  title: AI Tic-Tac-Toe Multiplayer API
  version: 1.0.0
  description: Server-authoritative Phase 2 HTTP contract. No user accounts or durable user identity exist.
servers:
  - url: https://api.example.invalid
    description: Environment-specific URL supplied by deployment outputs
paths:
  /api/v1/games:
    post:
      operationId: createGame
      summary: Create a waiting game and receive the X seat capability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGameRequest'
      responses:
        '201':
          description: Game created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/CapacityExceeded'
    get:
      operationId: listGames
      summary: List games by lifecycle status
      description: Results may be eventually consistent.
      parameters:
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/ListLimit'
      responses:
        '200':
          description: Page of games
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameList'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/games/{gameId}:
    get:
      operationId: getGame
      summary: Get a strongly consistent authoritative snapshot
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Authoritative game snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameSnapshot'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/games/{gameId}/events:
    get:
      operationId: getGameEvents
      summary: Replay durable events after an exclusive sequence
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/AfterSequence'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/EventLimit'
      responses:
        '200':
          description: Ascending page of durable events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/games/{gameId}/join:
    post:
      operationId: joinGame
      summary: Claim the O seat and activate a waiting game
      parameters:
        - $ref: '#/components/parameters/GameId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SequencedCommand'
      responses:
        '200':
          description: O seat claimed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/games/{gameId}/moves:
    post:
      operationId: makeMove
      summary: Suggest a move for the caller's seat
      security:
        - PlayerCapability: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveCommand'
      responses:
        '200':
          $ref: '#/components/responses/CommandAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/games/{gameId}/resign:
    post:
      operationId: resignGame
      summary: Resign an active game or cancel a waiting game as its creator
      security:
        - PlayerCapability: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SequencedCommand'
      responses:
        '200':
          $ref: '#/components/responses/CommandAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/games/{gameId}/abandonment-check:
    post:
      operationId: checkAbandonment
      summary: Ask the server to award an overdue opponent turn
      security:
        - PlayerCapability: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SequencedCommand'
      responses:
        '200':
          $ref: '#/components/responses/CommandAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    PlayerCapability:
      type: http
      scheme: bearer
      bearerFormat: opaque-game-seat-capability
      description: Game-scoped seat capability; not a user identity or login token.
  parameters:
    GameId:
      name: gameId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
    Status:
      name: status
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/GameStatus'
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    ListLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    EventLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    AfterSequence:
      name: afterSequence
      in: query
      required: false
      description: Exclusive last contiguous sequence already held by the caller.
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    CommandAccepted:
      description: Command accepted and persisted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommandResult'
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid game-seat capability
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Game not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Domain, idempotency, or optimistic-concurrency conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CapacityExceeded:
      description: "All 25 waiting/active game slots are held"
      headers:
        Retry-After:
          schema:
            type: integer
            const: 5
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Mark:
      type: string
      enum: [X, O]
    GameStatus:
      type: string
      enum: [waiting, active, over]
    EndReason:
      type:
        - string
        - 'null'
      enum: [line, draw, resignation, abandonment, cancelled, null]
    BoardCell:
      oneOf:
        - $ref: '#/components/schemas/Mark'
        - type: 'null'
    Move:
      type: object
      additionalProperties: false
      required: [ply, player, cell, acceptedAt]
      properties:
        ply:
          type: integer
          minimum: 1
          maximum: 9
        player:
          $ref: '#/components/schemas/Mark'
        cell:
          type: integer
          minimum: 0
          maximum: 8
        acceptedAt:
          type: string
          format: date-time
    GameSnapshot:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - sequence
        - board
        - moves
        - currentTurn
        - winner
        - endReason
        - createdAt
        - updatedAt
        - turnStartedAt
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/GameStatus'
        sequence:
          type: integer
          minimum: 1
        board:
          type: array
          minItems: 9
          maxItems: 9
          items:
            $ref: '#/components/schemas/BoardCell'
        moves:
          type: array
          maxItems: 9
          items:
            $ref: '#/components/schemas/Move'
        currentTurn:
          oneOf:
            - $ref: '#/components/schemas/Mark'
            - type: 'null'
        winner:
          oneOf:
            - $ref: '#/components/schemas/Mark'
            - type: 'null'
        endReason:
          $ref: '#/components/schemas/EndReason'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        turnStartedAt:
          type:
            - string
            - 'null'
          format: date-time
    CreateGameRequest:
      type: object
      additionalProperties: false
      required: [commandId]
      properties:
        commandId:
          type: string
          format: uuid
    SequencedCommand:
      type: object
      additionalProperties: false
      required: [commandId, expectedSequence]
      properties:
        commandId:
          type: string
          format: uuid
        expectedSequence:
          type: integer
          minimum: 1
    MoveCommand:
      allOf:
        - $ref: '#/components/schemas/SequencedCommand'
        - type: object
          additionalProperties: false
          required: [cell]
          properties:
            commandId:
              type: string
              format: uuid
            expectedSequence:
              type: integer
              minimum: 1
            cell:
              type: integer
              minimum: 0
              maximum: 8
    GameEvent:
      type: object
      additionalProperties: false
      required: [version, eventId, gameId, sequence, type, occurredAt, data, state]
      properties:
        version:
          type: integer
          const: 1
        eventId:
          type: string
        gameId:
          type: string
        sequence:
          type: integer
          minimum: 1
        type:
          type: string
          enum:
            - game.created
            - player.joined
            - move.accepted
            - game.resigned
            - game.abandoned
            - game.cancelled
        occurredAt:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true
        state:
          $ref: '#/components/schemas/GameSnapshot'
    CommandResult:
      type: object
      additionalProperties: false
      required: [game, event]
      properties:
        game:
          $ref: '#/components/schemas/GameSnapshot'
        event:
          $ref: '#/components/schemas/GameEvent'
    SeatSession:
      allOf:
        - $ref: '#/components/schemas/CommandResult'
        - type: object
          required: [mark, seatToken]
          properties:
            mark:
              $ref: '#/components/schemas/Mark'
            seatToken:
              type: string
              minLength: 32
              writeOnly: true
    GameList:
      type: object
      additionalProperties: false
      required: [items, nextCursor, consistency]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GameSnapshot'
        nextCursor:
          type:
            - string
            - 'null'
        consistency:
          type: string
          const: eventual
    EventPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, throughSequence]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GameEvent'
        nextCursor:
          type:
            - string
            - 'null'
        throughSequence:
          type: integer
          minimum: 1
    Problem:
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: Stable machine-readable error code.
          examples:
            - stale_sequence
        traceId:
          type: string
        currentSequence:
          type: integer
          minimum: 1
        eligibleAt:
          type: string
          format: date-time

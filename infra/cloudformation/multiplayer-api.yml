AWSTemplateFormatVersion: '2010-09-09'
Description: Phase 2 low-cost multiplayer API baseline for ai-tic-tac-toe-lab

Parameters:
  ApiArtifactBucketName:
    Type: String
    Description: S3 bucket containing the packaged multiplayer API artifact
  ApiArtifactKey:
    Type: String
    Description: S3 object key for the packaged multiplayer API artifact tarball
  ApiInstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
      - t4g.nano
      - t4g.micro
    Description: Low-cost EC2 instance type for the multiplayer API
  ApiPort:
    Type: Number
    Default: 8787
    Description: TCP port exposed by the multiplayer API
  AllowedApiCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR block allowed to reach the multiplayer API port
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Amazon Linux 2023 AMI from SSM public parameters

Resources:
  MultiplayerApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ReadApiArtifact
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub arn:aws:s3:::${ApiArtifactBucketName}/${ApiArtifactKey}
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !Sub arn:aws:s3:::${ApiArtifactBucketName}
                Condition:
                  StringLike:
                    s3:prefix: !Ref ApiArtifactKey

  MultiplayerApiInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref MultiplayerApiRole

  MultiplayerApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for the ai-tic-tac-toe multiplayer API
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ApiPort
          ToPort: !Ref ApiPort
          CidrIp: !Ref AllowedApiCidr
      Tags:
        - Key: Project
          Value: ai-tic-tac-toe-lab
        - Key: Phase
          Value: phase-2

  MultiplayerApiInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref ApiInstanceType
      IamInstanceProfile: !Ref MultiplayerApiInstanceProfile
      SecurityGroupIds:
        - !Ref MultiplayerApiSecurityGroup
      Tags:
        - Key: Name
          Value: ai-tic-tac-toe-phase2-api
        - Key: Project
          Value: ai-tic-tac-toe-lab
        - Key: Phase
          Value: phase-2
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail

          dnf update -y
          dnf install -y nodejs20 awscli tar gzip

          mkdir -p /opt/ai-tic-tac-toe
          aws s3 cp s3://${ApiArtifactBucketName}/${ApiArtifactKey} /tmp/multiplayer-api.tgz
          tar -xzf /tmp/multiplayer-api.tgz -C /opt/ai-tic-tac-toe

          cd /opt/ai-tic-tac-toe
          npm ci

          cat >/etc/systemd/system/ai-tic-tac-toe-api.service <<'EOF'
          [Unit]
          Description=AI Tic Tac Toe Multiplayer API
          After=network.target

          [Service]
          Type=simple
          WorkingDirectory=/opt/ai-tic-tac-toe
          Environment=PORT=${ApiPort}
          ExecStart=/usr/bin/npx tsx server/index.ts
          Restart=always
          RestartSec=5
          User=root

          [Install]
          WantedBy=multi-user.target
          EOF

          systemctl daemon-reload
          systemctl enable ai-tic-tac-toe-api.service
          systemctl start ai-tic-tac-toe-api.service

Outputs:
  ApiBaseUrl:
    Description: Public URL for the multiplayer API
    Value: !Sub http://${MultiplayerApiInstance.PublicDnsName}:${ApiPort}

  ApiInstanceId:
    Description: EC2 instance id hosting the multiplayer API
    Value: !Ref MultiplayerApiInstance

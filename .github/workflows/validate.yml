name: Validate

on:
  pull_request:
    branches: [zebanaya-kepler]
  push:
    branches: [zebanaya-kepler]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Full verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run complete non-deployment gate
        run: npm run verify

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: |
            coverage/
            **/TestResults/**/coverage.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy approved integration build
    needs: verify
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/zebanaya-kepler' &&
      vars.ENABLE_AWS_DEPLOYMENT == 'true'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: axian-lnd
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}

      - name: Install dependencies
        run: npm ci

      - name: Deploy infrastructure and application
        run: npm run infra:deploy
        env:
          DEPLOY_ENVIRONMENT: lnd
          SOURCE_COMMIT: ${{ github.sha }}

      - name: Write deployment summary
        run: |
          echo "### L&D deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Region: \`${{ vars.AWS_REGION || 'us-west-2' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: \`axian-lnd\`" >> "$GITHUB_STEP_SUMMARY"
